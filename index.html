<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuestra Invitación Mágica 💍</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body, html { 
        width: 100%; 
        height: 100%; 
        background: #000; 
        overflow: hidden; 
        position: fixed; 
        touch-action: none;
    }

    #game-container { 
        width: 100vw; 
        height: 100svh; 
        display: flex; 
        justify-content: center; 
        align-items: center; 
    }

    canvas { 
        /* Esto obliga al juego a estirarse y cubrir todo el fondo */
        width: 100% !important; 
        height: 100% !important; 
        object-fit: cover; 
    }
</style>
</head>
<body>
    <div id="game-container"></div>
    <script src="js/juego.js"></script>
</body>
</html>
