<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nuestra Invitación Mágica 💍</title>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; 
            height: 100%; 
            background: #000; 
            overflow: hidden; 
            position: fixed; 
            touch-action: none;
        }

        #game-container { 
            width: 100vw; 
            height: 100svh; /* svh se ajusta dinámicamente en móviles */
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; /* Mantiene la proporción en pantallas ultra-wide de 34" */
        }

        @media screen and (orientation: portrait) {
            #game-container::after {
                content: "🔄 Por favor, gira el móvil horizontal para jugar";
                position: absolute;
                top: 0; left: 0;
                color: #ffd700;
                font-family: sans-serif;
                background: #1a0f0a;
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                padding: 20px;
                z-index: 9999;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <script src="js/juego.js"></script>
</body>
</html>
